# Shipped defaults for the orchestration skill: the role list, and the
# role assigned to every delegation task.
#
# THIS FILE IS THE PACK'S DEFAULT, NOT THE PLACE TO CUSTOMIZE A REPO.
# A target repository overrides any key below in its own
# `.herdrpowers/config.yaml` (written by the init workflow) — that file wins
# key by key, and anything it omits falls back here. Plugin installations are
# read-only, so the repo file is the only editable layer on those installs.
# See "Configuration resolution" in SKILL.md.

# ---------------------------------------------------------------------------
# Role list. Roles bind to agent types, not to reserved panes: at delegation
# time, any idle pane of the matching agent type can take the task.
# `orchestrator` is not an agent type — it means the pane the user typed into.
#
# `agent:` (singular) binds one agent type: one task, one delegation.
# `agents:` (a list) binds several, and means ONE DELEGATION PER ENTRY — the
# task runs once per listed agent type, in separate panes. That is what makes
# a review a double review; it is a property of the role, not of any one task.
# See "Roles that bind to a list" in SKILL.md.
# ---------------------------------------------------------------------------
roles:
  planning-design:
    description: Planning and design work
    agent: orchestrator
  reviewer:
    description: >-
      Independent review — plans, designs, and implemented code. Bound to a
      list, so every task assigned to this role runs once per listed agent
      type.
    agents:
      - codex
      - cursor
  coder:
    description: >-
      Complex coding (see "Complex coding boundary" in SKILL.md), test
      authoring, and the whole-branch final review.
    agent: codex
  generalist:
    description: Simple coding, search, file inspection, tests, lint, routine operations
    agent: orchestrator

# Substitutes for an agent that cannot take work right now — usage/rate limit
# reached, no pane of that type in the session, or every pane of that type
# crashed and would not restart. See "Exhaustion and fallback" in SKILL.md.
#
# Tried left to right; the first substitute with a usable idle pane wins.
# An agent with no entry here has no substitute.
fallbacks:
  cursor: [grok]

# ---------------------------------------------------------------------------
# Delegation defaults that apply to every task and every workflow.
# See "Delegation scope" and "Execution strategy" in SKILL.md.
# ---------------------------------------------------------------------------
delegation:
  # Which panes may receive a delegation, relative to the orchestrator pane.
  # `herdr pane list` reports `pane_id`, `tab_id`, `workspace_id`, and `cwd`
  # for every pane, so the filter is a field comparison, not a guess.
  #   tab        only panes whose `tab_id` equals the orchestrator's. The
  #              default: a tab is how a herdr user separates projects, so a
  #              pane in another tab is usually another repository's pane.
  #   workspace  any pane in the orchestrator's `workspace_id`, any tab
  #   session    every agent pane herdr reports
  pane_scope: tab

  # Default execution strategy for `/full_cycle` and `/strict_full_cycle`.
  #   parallel  extract the plan's independent implementation tracks and run
  #             them concurrently, per `/execute_parallel`. The default.
  #   serial    run the plan's tasks one at a time, per `/execute`.
  # Either way a plan with fewer than two independent tracks runs serially —
  # this key sets what is attempted, not what is forced.
  execution: parallel

# ---------------------------------------------------------------------------
# Delegation tasks, each assigned a role. This is the routing table: the skill
# reads it instead of hard-coding "implementation goes to Coder".
#
# Every task takes the same knobs:
#   role     — which role from the list above performs it
#   mode     — where it runs:
#                delegate     a fresh idle pane of `role`, via
#                             using-herdr-sibling-panes
#                orchestrator the orchestrator pane itself. A work task runs
#                             inline there; a REVIEW task runs in a fresh
#                             in-process subagent the orchestrator spawns, so
#                             it never reviews its own session's work
#                implementer  the pane that already owns the task does it
#   enabled  — review tasks only: `false` removes the gate entirely.
#              Work tasks are mandatory; to stop delegating one, set
#              `mode: orchestrator` rather than disabling it.
#
# Every non-default assignment, every non-default mode, and every disabled
# review is named in the workflow's final report.
# ---------------------------------------------------------------------------
assignments:

  # --- work tasks (mandatory; `mode` decides whether they are delegated) ---

  plan-and-design:
    description: Brainstorming, design docs, and implementation plans
    role: planning-design
    mode: orchestrator # the orchestrator holds the design context; delegating loses it
  complex-coding:
    description: Implementation tasks over the "Complex coding boundary" in SKILL.md
    role: coder
    mode: delegate
  simple-coding:
    description: Localized, pattern-following edits under that same boundary
    role: generalist
    mode: orchestrator
  chores:
    description: Lookups, file moves, log gathering, mechanical edits, lint/format runs
    role: generalist
    mode: orchestrator
  test-authoring:
    description: >-
      Writing a task's tests for the implementation round. `mode: delegate`
      puts them in a pane that never sees the implementation: it works from the
      task brief alone, in parallel with the implementer, and its RED run comes
      free because it starts from BASE. See "Parallel test authoring" in
      pane-driven-development. `mode: implementer` collapses it back onto the
      implementing pane, which owns RED-GREEN-REFACTOR itself; independence
      then rests entirely on the reviewers auditing test code its author also
      implemented. Either way the report names which pane wrote the tests.
    role: coder
    mode: delegate
  fix-round-test-authoring:
    description: >-
      Writing or amending the covering tests for one fix round. A different
      pane from both the implementation-round test author and the pane that
      fixed the code — otherwise a fix's tests are written by whoever just
      changed the behavior. `mode: implementer` collapses it onto the fixing
      pane and gives that up.
    role: coder
    mode: delegate
  review-fixes:
    description: >-
      Fixing review findings. `mode: implementer` sends them back to the pane
      that wrote the code (fix-loop rounds 1-3); rounds 4-5 escalate to a fresh
      pane regardless, per "Escalation is a type swap" in SKILL.md. The fixing
      pane changes source only — its covering tests come from
      `fix-round-test-authoring`.
    role: coder
    mode: implementer
  verification:
    description: >-
      Running the repo's baseline and supplemental verification commands. A
      delegated run is a claim: the orchestrator accepts it on the quoted
      output in the report file, or re-runs the decisive command itself. With
      `mode: orchestrator` the orchestrator runs the commands in its own pane
      and its own output is the evidence.
    role: generalist
    mode: orchestrator

  # --- review tasks (optional; `enabled: false` removes the gate) ---

  plan-review:
    description: Independent review of a plan or design before approval (/plan, /full_cycle)
    role: reviewer
    mode: delegate
    enabled: true
  documentation-impact-review:
    description: Pre-implementation sweep for non-code files the change will invalidate
    role: generalist
    mode: orchestrator
    enabled: true
  task-review:
    description: Per-task gate in pane-driven-development — spec compliance + code quality
    role: reviewer
    mode: delegate
    enabled: true
  fix-round-re-review:
    description: Scoped verification of one fix round's diff (re-review-brief.md)
    role: reviewer
    mode: delegate
    enabled: true
  final-branch-review:
    description: Broad whole-branch review before the integration decision
    role: reviewer
    mode: delegate
    enabled: true
